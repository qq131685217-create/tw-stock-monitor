<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股全市場（1,867家）量化監測與即時更新資料庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f7fb;
            --bg-strong: #eef5ff;
            --panel: rgba(255,255,255,0.92);
            --panel-strong: #ffffff;
            --border: #e2e8f0;
            --border-strong: #cfe0ff;
            --text: #0f172a;
            --muted: #64748b;
            --blue: #2563eb;
            --blue-soft: #eff6ff;
            --indigo: #4f46e5;
            --rose: #e11d48;
            --amber: #d97706;
            --emerald: #059669;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59,130,246,0.15), transparent 25%),
                radial-gradient(circle at bottom right, rgba(139,92,246,0.12), transparent 20%),
                linear-gradient(180deg, var(--bg-strong) 0%, var(--bg) 100%);
            color: var(--text);
            letter-spacing: 0.01em;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(148,163,184,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(148,163,184,0.04) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
        }

        input[type="range"].quant-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 7px;
            border-radius: 9999px;
            background: linear-gradient(90deg, #93c5fd 0%, #bfdbfe 100%);
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
        }

        input[type="range"].quant-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.42);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"].quant-slider::-webkit-slider-thumb:hover {
            transform: scale(1.12);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
        }

        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: rgba(148,163,184,0.8) transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148,163,184,0.7);
            border-radius: 9999px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100,116,139,0.9);
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-spin-fast {
            animation: spinSlow 0.8s linear infinite;
        }

        .bg-white, section.bg-white,
        .rounded-2xl,
        .rounded-xl,
        .rounded-lg {
            box-shadow: var(--shadow) !important;
        }

        section.bg-white {
            border-color: rgba(226, 232, 240, 0.95) !important;
            background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,255,255,0.92)) !important;
        }

        button, select, input {
            transition: all 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .preset-btn,
        .qual-pill,
        .mkt-btn,
        .news-tab,
        .top10-tab,
        .quant-slider {
            border-radius: 0.9rem;
        }

        .preset-btn:hover,
        .qual-pill:hover,
        .mkt-btn:hover,
        .news-tab:hover,
        .top10-tab:hover {
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
        }

        @media (max-width: 1024px) {
            main {
                padding-bottom: 2rem;
            }

            body {
                background-attachment: fixed;
            }
        }
    </style>
</head>
<body class="min-h-screen lg:h-screen lg:overflow-hidden flex flex-col antialiased selection:bg-blue-100 selection:text-blue-900">
