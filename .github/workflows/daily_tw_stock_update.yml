name: Daily TWSE & TPEx Market Data Auto-Update

on:
  schedule:
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. 簽出儲存庫程式碼
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝依賴
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests httpx

      - name: 4. 執行台股全市場（上市＋上櫃）數據爬蟲
        run: |
          python fetch_tw_all_market.py
          test -f tw_market_data.json

      - name: 5. 自動 Commit 並推播最新 tw_market_data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true

          git add tw_market_data.json
          if git diff --cached --quiet; then
            echo "目前資料無變動（盤中尚未釋出新盤後檔或休市日），無需提交。"
            exit 0
          fi

          git commit -m "chore: 自動更新台股全市場行情與三大法人數據 ($(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M'))"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
